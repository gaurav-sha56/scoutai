services:
  scoutai_backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: scoutai-backend:latest
    container_name: scoutai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    # Optional: if you run Ollama locally on host machine:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

